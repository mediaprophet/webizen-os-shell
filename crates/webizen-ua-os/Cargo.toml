[package]
name = "webizen-ua-os"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "User-Agent OS runtime for Guest & Debian Trixie Appliance SKUs: native Etalon GPU, Anvil NP64, Qap installer/launcher, QualiaDB sidecar bridge, and unified Poet/Hypermedia workbench."
license = "CC-BY-NC-ND-4.0"
publish = false

[lib]
name = "webizen_ua_os"

[dependencies]
anvil-core = { path = "../../../../anvil/crates/anvil-core", features = ["std"] }
anvil-gpu = { path = "../../../../anvil/crates/anvil-gpu" }
etalon = { git = "https://github.com/mediaprophet/etalon.git", rev = "a8f12b3f769fe7c8f33c6b93fece6aa046f6db16", default-features = false, features = ["std", "vulkan", "dx12", "wgsl"] }
vibescript-abi = { path = "../../../../qualiaDB/crates/vibescript-abi" }
vibe = { path = "../../../../qualiaDB/crates/vibe" }
etalon-vibe = { path = "../../../../etalon/crates/etalon-vibe" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
sha3 = "0.10"
