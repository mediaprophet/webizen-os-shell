[package]
name = "webizen-os-shell"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
description = "Webizen OS-Shell Guest chrome: Aether native HaloBar/OrbitWheel (C1). Qualia returns at C2."

[features]
default = ["native"]
# CPU softbuffer paint. Renderer features live on the aether-native path pin.
native = []

[dependencies]
aether = { path = "../../Aether/packages/aether", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "native"] }
aether-native = { path = "../../Aether/packages/native", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "clipboard", "accessibility", "html"] }

# Qualia crates return at C2 (`qualia-client-core` via relative `../../qualiaDB/...`).
# Do not path-pin `../qualiaDB` from this tree; that directory does not exist.

# Aether workspace patches do not apply to this package. Match B1a vendor Blitz
# (CompletionHandler / NetError live there, not on crates.io 0.3.0-beta.4).
[patch.crates-io]
blitz-traits = { path = "../../Aether/vendor/blitz/blitz-traits" }
blitz-dom = { path = "../../Aether/vendor/blitz/blitz-dom" }
blitz-net = { path = "../../Aether/vendor/blitz/blitz-net" }
