[workspace]
members = [".", "crates/webizen-ua-os"]
resolver = "2"

[package]
name = "webizen-os-shell"
version = "0.0.40"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
description = "Webizen OS-Shell: Aether native spatial shell on Etalon native GPU with integrated QualiaDB, Poet, and Hypermedia runtime."

[features]
default = ["native"]
# Chrome GPU is Etalon Vulkan/DX12 via aether-native vello-hybrid (64-bit host).
# Do not enable vello-cpu-softbuffer alongside hybrid: CPU overrides hybrid in aether-native.
native = ["dep:aether", "dep:aether-native", "dep:aether-qualia-host", "dep:etalon", "dep:tray-icon", "dep:anyrender", "dep:peniko", "dep:kurbo", "dep:blitz-dom", "dep:blitz-traits"]
chora = ["native", "aether-native/chora", "aether-qualia-host/chora-client", "dep:url"]
gpu-cpu-fallback = ["native", "aether-native/gpu-cpu-fallback"]
# Canonical Webizen Debian native feature presets. `webizen-native-host` builds
# `webizen-hostd` without Aether windowing. Subsystem / IoT display keep GPU with CPU fallback.
webizen-native-desktop = ["native"]
webizen-native-subsystem = ["native", "gpu-cpu-fallback"]
webizen-native-mobile = ["native", "gpu-cpu-fallback"]
webizen-native-iot-display = ["native", "gpu-cpu-fallback"]
webizen-native-host = []


[[bin]]
name = "webizen-os-shell"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "webizen-hostd"
path = "src/bin/webizen-hostd.rs"

[dependencies]
aether = { optional = true, path = "../../Aether/packages/aether", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "native", "refract"] }
aether-native = { optional = true, path = "../../Aether/packages/native", default-features = false, features = ["vello-hybrid", "system-fonts", "clipboard", "accessibility", "html"] }
aether-qualia-host = { optional = true, path = "../../Aether/packages/qualia-host" }
# Feature-unify Etalon backends onto the local 0.0.41.3 tree (Vulkan + DX12 native GPU).
etalon = { optional = true, git = "https://github.com/mediaprophet/etalon.git", rev = "a8f12b3f769fe7c8f33c6b93fece6aa046f6db16", default-features = false, features = ["std", "vulkan", "dx12", "wgsl"] }

webizen-ua-os = { path = "crates/webizen-ua-os" }
tray-icon = { optional = true, version = "0.26.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyrender = { version = "0.14.0", optional = true }
peniko = { version = "0.6.1", optional = true }
kurbo = { version = "0.13.1", optional = true }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-traits = { version = "=0.3.0-beta.4", optional = true }
url = { version = "2.5", optional = true }

[patch.crates-io]
blitz-traits = { path = "../../Aether/vendor/blitz/blitz-traits" }
blitz-dom = { path = "../../Aether/vendor/blitz/blitz-dom" }
blitz-net = { path = "../../Aether/vendor/blitz/blitz-net" }

[patch."https://github.com/mediaprophet/etalon.git"]
etalon = { path = "../../etalon/etalon" }
etalon-vibe = { path = "../../etalon/crates/etalon-vibe" }
etalon-nquin = { path = "../../etalon/crates/etalon-nquin" }
etalon-resources = { path = "../../etalon/crates/etalon-resources" }
etalon-sense-core = { path = "../../etalon/crates/etalon-sense-core" }
etalon-signal = { path = "../../etalon/crates/etalon-signal" }
etalon-wgsl-forge = { path = "../../etalon/crates/etalon-wgsl-forge" }

[patch."https://github.com/mediaprophet/vibe-script.git"]
vibescript-abi = { path = "../../qualiaDB/crates/vibescript-abi" }

[patch."https://github.com/mediaprophet/hypermedia-production.git"]
vector-hybrid-render-adapter = { path = "../../hypermedia-production/crates/vector-hybrid-render-adapter" }
gpu-device-context = { path = "../../hypermedia-production/crates/gpu-device-context" }

# Canonical Webizen Debian native Cargo profiles (PLAN-WEBIZEN-DEBIAN-NATIVE-PROFILES-2026-11-26).
[profile.webizen-host]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-desktop]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-subsystem]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-iot-headless]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.webizen-iot-display]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

